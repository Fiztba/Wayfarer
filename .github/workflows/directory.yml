name: MUD directory

# Refreshes public-data/directory.json: re-reads every source, probes every
# address, and commits the result. Wayfarer downloads that file, so the MUD
# list improves without shipping an app update.
#
# Running the sweep here rather than in the app is deliberate. Every install
# probing ~700 MUDs on launch is the rude version of this; one job a week is
# defensible, and it means users probe nothing at all.
#
# The build refuses to write a snapshot whose failure rate jumps more than 15
# points above the previous one, so a run with blocked egress or broken DNS
# fails loudly instead of quietly burying the whole directory.

on:
  schedule:
    # Sundays, 07:00 UTC. MSSP crawl delays are measured in hours, so weekly is
    # comfortably inside what every source asks for.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      skip_probe:
        description: 'Rebuild from cached source data without probing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mud-directory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A run that lands the one-time Top Mud Sites crawl takes ~35 minutes on its
    # own; every other run is about two.
    timeout-minutes: 90
    env:
      # Job level, not step level: a step's own `env` block is not in scope when
      # that step's `if:` is evaluated, so gating the MUDVerse step on a
      # step-level var would skip it forever, silently, even once the secret
      # exists.
      MUDVERSE_API_KEY: ${{ secrets.MUDVERSE_API_KEY }}
      # dns.lookup runs on libuv's thread pool, which defaults to 4. The sweep
      # is DNS-bound on dead hosts, and half these listings are dead.
      UV_THREADPOOL_SIZE: 64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken parser would otherwise be discovered by committing bad data.
      - run: npm run typecheck
      - run: node --experimental-strip-types test/directory-smoke.mts

      # Each source is allowed to fail without taking the build down: a
      # directory site being briefly unreachable should cost us that source's
      # freshness, not the whole snapshot. The builder reads whatever landed.
      - name: Refresh The Mud Connector
        continue-on-error: true
        run: npm run directory:tmc

      - name: Refresh MSSP crawler
        continue-on-error: true
        run: npm run directory:mssp

      - name: Refresh Vineyard
        continue-on-error: true
        run: npm run directory:vineyard

      - name: Refresh Grapevine
        continue-on-error: true
        run: npm run directory:grapevine

      # Top Mud Sites is a one-time crawl, not a weekly one: votes are
      # deprecated, the listing is unmaintained, and the data will not change
      # again. But its origin spends long stretches behind a Cloudflare 522, so
      # rather than needing someone to notice when it returns, this attempts the
      # crawl every week until it lands and then stops asking.
      #
      # The crawler self-skips when the site is down and resumes where it left
      # off if a run is cut short, so a half-finished crawl finishes next week.
      - name: Refresh Top Mud Sites (once, when it is reachable)
        continue-on-error: true
        run: |
          COUNT=$(node -e "try { console.log(require('./scripts/directory/data/tms.json').length) } catch { console.log(0) }")
          if [ "$COUNT" -ge 1900 ]; then
            echo "Already have $COUNT TMS records and the listing is frozen — nothing to do."
            exit 0
          fi
          echo "Have $COUNT of ~1963 TMS records; attempting the crawl."
          npm run directory:tms

      # Optional: only runs once MUDVERSE_API_KEY exists as a repository secret.
      # The key is never committed and never shipped in the app.
      - name: Refresh MUDVerse
        continue-on-error: true
        if: ${{ env.MUDVERSE_API_KEY != '' }}
        run: npm run directory:mudverse

      - name: Build snapshot
        run: npm run directory:build

      - name: Commit if changed
        run: |
          # Source data counts as a change, not just the snapshot. The Top Mud
          # Sites crawl resumes from whatever it already has, so a run cut short
          # must commit its partial tms.json or next week starts from zero.
          if git diff --quiet -- public-data/directory.json scripts/directory/data; then
            echo "No directory changes."
            exit 0
          fi
          node -e "
            const s = require('./public-data/directory.json');
            console.log('total', s.counts.total, 'live', s.counts.live);
          "
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data/directory.json scripts/directory/data
          git commit -m "Directory refresh: $(node -p "require('./public-data/directory.json').counts.live") live of $(node -p "require('./public-data/directory.json').counts.total")"
          git push
